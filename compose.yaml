# FleetPulse local stack (contract 05, task T15).
#
# Every service is restarted with `unless-stopped` and logs are capped at
# 10 MB x 3. Copy .env.example to .env to override the defaults below.

name: fleetpulse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by every service. A zero memory/CPU limit means "unlimited", which is
# the default; set MEM_LIMIT/CPUS in .env to cap the whole stack.
x-common: &common
  restart: unless-stopped
  logging: *logging
  mem_limit: ${MEM_LIMIT:-0}
  cpus: ${CPUS:-0}

x-build: &build
  context: .
  dockerfile: build/Dockerfile

x-log-env: &log-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_ADDR: clickhouse:9000
  CLICKHOUSE_DB: fleetpulse
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

x-nats-env: &nats-env
  NATS_URL: nats://nats:4222
  NATS_REPLICAS: ${NATS_REPLICAS:-1}

services:
  nats:
    <<: *common
    image: nats:2.15.3
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data

  clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:26.8.37.168
    # Since 24.8 the image limits user "default" to localhost unless a user or
    # password is configured. Contract 05 keeps the empty-password default, so
    # the local stack opts out of that setup instead. Do not expose 8123/9000
    # outside your machine.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  writer:
    <<: *common
    image: fleetpulse-writer:${VERSION:-0.1.0}
    build:
      <<: *build
      args:
        CMD: writer
        VERSION: ${VERSION:-0.1.0}
    environment:
      <<: [*log-env, *clickhouse-env, *nats-env]
      HTTP_ADDR: ":9400"
      WRITER_BATCH_ROWS: ${WRITER_BATCH_ROWS:-50000}
      WRITER_BATCH_WAIT: ${WRITER_BATCH_WAIT:-2s}
      WRITER_FETCH_MSGS: ${WRITER_FETCH_MSGS:-500}
    ports:
      - "${WRITER_STATUS_PORT:-9400}:9400"
    depends_on:
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_started

  scraper:
    <<: *common
    image: fleetpulse-scraper:${VERSION:-0.1.0}
    build:
      <<: *build
      args:
        CMD: scraper
        VERSION: ${VERSION:-0.1.0}
    environment:
      <<: [*log-env, *nats-env]
      HTTP_ADDR: ":9300"
      SCRAPER_CONFIG: /etc/fleetpulse/scraper.yaml
      SCRAPER_CURSOR_FILE: /data/cursors.json
    volumes:
      - ./deploy/scraper/scraper.yaml:/etc/fleetpulse/scraper.yaml:ro
      - scraper-data:/data
    ports:
      - "${SCRAPER_STATUS_PORT:-9300}:9300"
    depends_on:
      nats:
        condition: service_started

  simulator:
    <<: *common
    image: fleetpulse-simulator:${VERSION:-0.1.0}
    build:
      <<: *build
      args:
        CMD: simulator
        VERSION: ${VERSION:-0.1.0}
    environment:
      <<: *log-env
      HTTP_ADDR: ":9200"
      SIM_DEVICES: ${SIM_DEVICES:-20}
      SIM_SEED: ${SIM_SEED:-1}
      SIM_FANLESS_RATIO: ${SIM_FANLESS_RATIO:-0.1}
      SIM_PUBLIC_URL: ${SIM_PUBLIC_URL:-http://simulator:9200}
    ports:
      - "${SIMULATOR_PORT:-9200}:9200"

  seed:
    <<: *common
    restart: "no"
    image: fleetpulse-backfill:${VERSION:-0.1.0}
    build:
      <<: *build
      args:
        CMD: backfill
        VERSION: ${VERSION:-0.1.0}
    environment:
      <<: [*log-env, *clickhouse-env]
    command:
      - --devices
      - ${SIM_DEVICES:-20}
      - --seed
      - ${SIM_SEED:-1}
      - --fanless-ratio
      - ${SIM_FANLESS_RATIO:-0.1}
      - --raw-days
      - "3"
      - --rollup-days
      - "14"
    depends_on:
      clickhouse:
        condition: service_healthy

  query:
    <<: *common
    image: fleetpulse-query:${VERSION:-0.1.0}
    build:
      <<: *build
      args:
        CMD: query
        VERSION: ${VERSION:-0.1.0}
    environment:
      <<: [*log-env, *clickhouse-env]
      HTTP_ADDR: ":8080"
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-10s}
    ports:
      - "${QUERY_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  nats-data:
  ch-data:
  scraper-data:
